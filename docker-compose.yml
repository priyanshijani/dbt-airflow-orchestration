# dtc-growth: local stack. See docs/04_ARCHITECTURE.md §2 and ADR-008/018/019.
name: dtc-growth

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  # Laptop-sized scheduling (ADR-019): few concurrent tasks, and the DAG folder is parsed rarely and by one
  # process. Re-parsing 7 files every 30 s while tasks start starved the scheduler on a 2.5 GB container.
  AIRFLOW__CORE__PARALLELISM: "3"
  # a task on a starved laptop can miss heartbeats for minutes; do not declare it dead too early
  AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: "1200"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
  AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
  AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  # Local demo: no login screen. Production would use a real auth manager.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "600"
  AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "900"
  AIRFLOW__SCHEDULER__SCHEDULER_IDLE_SLEEP_TIME: "5"
  AIRFLOW__SCHEDULER__PARSING_CLEANUP_INTERVAL: "900"
  # Connections, defined as env vars so nothing is clicked together in the UI
  AIRFLOW_CONN_SHOP_POSTGRES: postgresql://${SHOP_DB_USER}:${SHOP_DB_PASSWORD}@postgres:5432/shop
  AIRFLOW_CONN_CLICKHOUSE_ETL: clickhouse://etl_writer:${CLICKHOUSE_ETL_PASSWORD}@clickhouse:8123/raw
  S3_ENDPOINT_URL: http://seaweedfs:8333
  POSTGRES_HOST: postgres
  PROJECT_ROOT: /opt/project

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      SHOP_DB_USER: ${SHOP_DB_USER}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_ETL_PASSWORD: ${CLICKHOUSE_ETL_PASSWORD}
      CLICKHOUSE_AGENT_PASSWORD: ${CLICKHOUSE_AGENT_PASSWORD}
      CLICKHOUSE_HUB_PASSWORD: ${CLICKHOUSE_HUB_PASSWORD}
      CLICKHOUSE_AI_WRITER_PASSWORD: ${CLICKHOUSE_AI_WRITER_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # single-file mounts: keep the image's own config.d/users.d files intact
      - ./infra/clickhouse/config.d/low_memory.xml:/etc/clickhouse-server/config.d/low_memory.xml:ro
      - ./infra/clickhouse/users.d/profiles.xml:/etc/clickhouse-server/users.d/profiles.xml:ro
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      retries: 30

  # S3-compatible landing zone (replaces MinIO, see ADR-018)
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"landing","credentials":[{"accessKey":"${S3_ACCESS_KEY}","secretKey":"${S3_SECRET_KEY}"}],"actions":["Admin","Read","List","Tagging","Write"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -volume.max=0 \
          -filer -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    ports: ["8333:8333", "8888:8888"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/ >/dev/null || exit 1"]
      interval: 5s
      retries: 30

  # Airflow 3 in one container: api-server + scheduler + dag-processor + triggerer (ADR-019)
  airflow:
    build: ./docker/airflow
    image: dtc-growth/airflow:local
    command: standalone
    env_file: .env
    environment: *airflow-env
    volumes:
      - .:/opt/project
      - airflow-logs:/opt/airflow/logs
    ports: ["8080:8080"]
    mem_limit: 2g
    cpus: 1.5   # idle Airflow re-parsing DAGs on the Windows mount otherwise takes ~3 cores and starves ClickHouse
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      start_period: 90s
      retries: 20

  insights-hub:
    build: ./docker/insights_hub
    image: dtc-growth/insights-hub:local
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      AIRFLOW_API_URL: http://airflow:8080
    volumes:
      - ./insights_hub:/app/insights_hub:ro
      - ./insights_hub/.streamlit:/app/.streamlit:ro   # theme (ADR-027)
      - ./reports:/app/reports:ro
    ports: ["8501:8501"]
    mem_limit: 512m
    depends_on:
      clickhouse: { condition: service_healthy }

  # dbt docs (lineage + column docs) at :8081. Regenerated hourly so the catalog catches up once the marts exist.
  dbt-docs:
    image: dtc-growth/airflow:local
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - .:/opt/project:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/docs
        (while true; do
           /opt/airflow/dbt-venv/bin/dbt docs generate --project-dir /opt/project/dbt --profiles-dir /opt/project/dbt \
             --target-path /tmp/docs --log-path /tmp/dbt-logs --no-use-colors > /tmp/docs-generate.log 2>&1
           sleep 3600
         done) &
        exec python -m http.server 8081 --directory /tmp/docs
    ports: ["8081:8081"]
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      clickhouse: { condition: service_healthy }

volumes:
  postgres-data:
  clickhouse-data:
  seaweedfs-data:
  airflow-logs:
