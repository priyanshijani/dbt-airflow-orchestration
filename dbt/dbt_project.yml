name: dtc_growth
version: "1.0.0"
config-version: 2
profile: dtc_growth

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # GA4's public sample covers 2020-11-01..2021-01-31; every GA4 date is moved forward by exactly 261 weeks
  # so weekdays and Black Friday line up with the 2025-26 simulation window (ADR-020). Keep in sync with
  # generators/config.py GA4_SHIFT_DAYS.
  ga4_shift_days: 1827

on-run-end:
  - "{{ log_run_results(results) }}"

models:
  dtc_growth:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  dtc_growth:
    +schema: staging
